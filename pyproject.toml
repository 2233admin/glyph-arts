[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glyph-arts"
dynamic = ["version"]
description = "Terminal-visible chart toolkit -- 29 chart types (incl. image/video via chafa+ffmpeg) + live animation rendered directly in the CLI, no browser, no files."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["cli", "charts", "terminal", "visualization", "ascii", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Terminals",
]
dependencies = [
    "duckdb>=0.10",
    "networkx>=3.0",
    "pandas>=2.0",
    "phart>=0.4",
    "plotext>=5.2",
    "plotille>=0.5",
    "pyfiglet>=0.8",
    "rich>=13.0",
    "sparklines>=0.4",
    "uniplot>=0.5",
]

[project.optional-dependencies]
art     = ["art>=6.0"]
braille = ["drawille>=0.2"]
lttb    = ["lttb>=0.3"]
pixel   = ["matplotlib>=3.7"]
test    = ["pytest>=7", "numpy>=1.24"]
tui     = ["textual>=0.50"]
interactive = ["textual>=0.50"]
all     = ["art>=6.0", "drawille>=0.2", "lttb>=0.3", "matplotlib>=3.7", "textual>=0.50"]

[project.scripts]
glyph-arts = "cli_charts.chart:main"
glyph-arts-dashboard = "cli_charts.dashboard:main"

[project.urls]
Homepage = "https://github.com/2233admin/glyph-arts"
Repository = "https://github.com/2233admin/glyph-arts"
Changelog = "https://github.com/2233admin/glyph-arts/blob/master/CHANGELOG.md"

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
include = ["cli_charts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests that require a real TTY or subprocess (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "E402"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
