name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  NX_DAEMON: "false"

jobs:
  test:
    name: pytest (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest, windows-latest, macos-latest]
        exclude:
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Nx
        run: npm ci
      - name: Sync Python environment
        run: uv sync --frozen --extra all --extra test --extra dev
      - name: Run tests via Nx
        run: npx nx run glyph-arts:test

  quality:
    name: lint / typecheck / docs / doctor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Nx
        run: npm ci
      - name: Sync Python environment
        run: uv sync --frozen --extra all --extra test --extra dev
      - name: Run quality targets via Nx
        run: npx nx run-many -t lint typecheck docs-check doctor --parallel=3

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Nx
        run: npm ci
      - name: Sync Python environment
        run: uv sync --frozen --extra all --extra test --extra dev
      - name: Test with coverage via Nx
        run: npx nx run glyph-arts:coverage
      - uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
